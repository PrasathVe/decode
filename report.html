<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Skill Assessment Generator</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      background:#eef2f9;
      padding:40px;
    }

    .container{
      max-width:1550px;
      margin:auto;
      display:grid;
      grid-template-columns:420px 1fr;
      gap:40px;
      align-items:start;
    }

    .controls,
    .preview{
      background:#fff;
      border-radius:28px;
      padding:30px;
      box-shadow:0 10px 40px rgba(0,0,0,0.08);
    }

    .controls h1{
      font-size:32px;
      margin-bottom:10px;
      color:#111827;
    }

    .controls p{
      color:#64748b;
      margin-bottom:25px;
    }

    .section-heading{
      font-size:20px;
      font-weight:700;
      color:#0f172a;
      margin-top:32px;
      margin-bottom:15px;
      padding-bottom:10px;
      border-bottom:1px solid #e5e7eb;
    }

    .field{
      display:grid;
      grid-template-columns:1fr 120px;
      gap:12px;
      margin-bottom:16px;
    }

    input,
    select{
      padding:14px 16px;
      border-radius:14px;
      border:1px solid #dbe2ea;
      font-size:15px;
      outline:none;
    }

    .download-btn{
      width:100%;
      margin-top:18px;
      padding:15px;
      border:none;
      border-radius:18px;
      background:#808000;
      color:white;
      font-size:15px;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;
    }

    .download-btn:hover{
      background:#6d7200;
    }

    /* CARD */

    .report-section{
      background:#fff;
      border-radius:28px;
      padding:35px;
      margin-bottom:35px;
      box-shadow:0 10px 40px rgba(0,0,0,0.08);
    }

    /* MAIN SKILLS */

    .top-section{
      display:grid;
      grid-template-columns:280px 1fr;
      gap:30px;
      align-items:center;
    }

    .circle-wrap{
      position:relative;
      width:240px;
      height:240px;
      margin:auto;
    }

    svg{
      transform:rotate(-90deg);
    }

    .circle-text{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
    }

    .circle-text h2{
      font-size:64px;
      color:#0f172a;
      font-weight:700;
    }

    .circle-text span{
      color:#475569;
      font-size:18px;
    }

    .skill{
      margin-bottom:30px;
    }

    .skill:last-child{
      margin-bottom:0;
    }

    .skill-top{
      display:flex;
      justify-content:space-between;
      gap:20px;
      margin-bottom:10px;
    }

    .skill-top h3{
      font-size:24px;
      color:#0f172a;
      font-weight:600;
    }

    .skill-top span{
      font-size:22px;
      font-weight:700;
      color:#334155;
    }

    .bar{
      width:100%;
      height:14px;
      background:#dbe5f1;
      border-radius:50px;
      overflow:hidden;
    }

    .fill{
      height:100%;
      background:#808000;
      border-radius:50px;
    }

    /* MATCHING CARDS */

    .match-card{
      border:1px solid #d9e1ef;
      border-radius:24px;
      padding:28px;
    }

    .match-title{
      display:inline-block;
      background:#808000;
      color:white;
      padding:10px 18px;
      border-radius:12px;
      font-size:20px;
      font-weight:700;
      margin-bottom:14px;
    }

    .match-sub{
      color:#475569;
      margin-bottom:24px;
      font-size:15px;
    }

    .match-item{
      margin-bottom:20px;
    }

    .match-item:last-child{
      margin-bottom:0;
    }

    .match-top{
      display:flex;
      justify-content:space-between;
      gap:15px;
      margin-bottom:8px;
    }

    .match-name{
      font-size:17px;
      color:#0f172a;
      font-weight:500;
    }

    .match-score{
      font-weight:700;
      color:#1e3a8a;
    }

    .match-bar{
      width:100%;
      height:10px;
      background:#dbe5f1;
      border-radius:100px;
      overflow:hidden;
    }

    .match-fill{
      height:100%;
      background:#808000;
      border-radius:100px;
    }

    @media(max-width:1000px){

      .container{
        grid-template-columns:1fr;
      }

      .top-section{
        grid-template-columns:1fr;
      }

    }

  </style>
</head>
<body>

<div class="container">

  <!-- CONTROLS -->

  <div class="controls">

    <h1>Skill Assessment Generator</h1>

    <p>
      Edit all sections independently and export separately.
    </p>

    <!-- MAIN SKILLS -->

    <div class="section-heading">
      Main Skills
    </div>

    <div id="skillsFields"></div>

    <!-- INDUSTRIES -->

    <div class="section-heading">
      Matching Industry
    </div>

    <div id="industryFields"></div>

    <!-- ROLES -->

    <div class="section-heading">
      Matching Roles
    </div>

    <div id="rolesFields"></div>

  </div>

  <!-- PREVIEW -->

  <div class="preview">

    <!-- MAIN SKILLS CARD -->

    <div class="report-section">

      <div id="skillsCard">

        <div class="top-section">

          <div class="circle-wrap">

            <svg width="240" height="240">

              <circle
                cx="120"
                cy="120"
                r="95"
                stroke="#dbe5f1"
                stroke-width="16"
                fill="none"
              ></circle>

              <circle
                id="progressCircle"
                cx="120"
                cy="120"
                r="95"
                stroke="#808000"
                stroke-width="16"
                fill="none"
                stroke-linecap="round"
              ></circle>

            </svg>

            <div class="circle-text">
              <h2 id="overallScore">85%</h2>
              <span>Overall Score</span>
            </div>

          </div>

          <div id="skillsPreview"></div>

        </div>

      </div>

      <button class="download-btn" onclick="downloadSection('skillsCard','main-skills-report.png')">
        Download Main Skills PNG
      </button>

    </div>

    <!-- INDUSTRY CARD -->

    <div class="report-section">

      <div id="industryCard">

        <div class="match-card">

          <div class="match-title">
            MATCHING INDUSTRY
          </div>

          <p class="match-sub">
            Top industries where you are best suited
          </p>

          <div id="industryPreview"></div>

        </div>

      </div>

      <button class="download-btn" onclick="downloadSection('industryCard','matching-industry-report.png')">
        Download Industry PNG
      </button>

    </div>

    <!-- ROLES CARD -->

    <div class="report-section">

      <div id="rolesCard">

        <div class="match-card">

          <div class="match-title">
            MATCHING ROLES
          </div>

          <p class="match-sub">
            Top roles aligned with your natural skills
          </p>

          <div id="rolesPreview"></div>

        </div>

      </div>

      <button class="download-btn" onclick="downloadSection('rolesCard','matching-roles-report.png')">
        Download Roles PNG
      </button>

    </div>

  </div>

</div>

<script>

  // DATA

  const skills = [
    { name:'Technical Skills', score:90 },
    { name:'Problem Solving', score:85 },
    { name:'Communication', score:80 },
    { name:'Analytical Thinking', score:82 },
    { name:'Leadership', score:88 }
  ];

  const industries = [
    { name:'Information Technology', score:92 },
    { name:'Data Analytics', score:88 },
    { name:'Consulting', score:81 },
    { name:'Fintech', score:78 },
    { name:'Product Management', score:74 }
  ];

  const roles = [
    { name:'Data Analyst', score:92 },
    { name:'Business Analyst', score:88 },
    { name:'Data Scientist', score:82 },
    { name:'Product Analyst', score:77 },
    { name:'Strategy Analyst', score:72 }
  ];

  // CONTAINERS

  const skillsFields = document.getElementById('skillsFields');
  const industryFields = document.getElementById('industryFields');
  const rolesFields = document.getElementById('rolesFields');

  const skillsPreview = document.getElementById('skillsPreview');
  const industryPreview = document.getElementById('industryPreview');
  const rolesPreview = document.getElementById('rolesPreview');

  // FIELD CREATOR

  function createField(container, item, index, updateText, updateScore){

    let options = '';

    for(let i=1;i<=100;i++){

      options += `
        <option value="${i}"
          ${item.score === i ? 'selected' : ''}>
          ${i}%
        </option>
      `;

    }

    const field = document.createElement('div');

    field.className = 'field';

    field.innerHTML = `

      <input
        type="text"
        value="${item.name}"
        oninput="${updateText.name}(${index}, this.value)"
      >

      <select onchange="${updateScore.name}(${index}, this.value)">
        ${options}
      </select>

    `;

    container.appendChild(field);

  }

  // RENDER FIELDS

  function renderFields(){

    skillsFields.innerHTML = '';
    industryFields.innerHTML = '';
    rolesFields.innerHTML = '';

    skills.forEach((item,index)=>{
      createField(
        skillsFields,
        item,
        index,
        updateSkill,
        updateSkillScore
      );
    });

    industries.forEach((item,index)=>{
      createField(
        industryFields,
        item,
        index,
        updateIndustry,
        updateIndustryScore
      );
    });

    roles.forEach((item,index)=>{
      createField(
        rolesFields,
        item,
        index,
        updateRole,
        updateRoleScore
      );
    });

  }

  // RENDER SKILLS

  function renderSkills(){

    skillsPreview.innerHTML = '';

    skills.forEach(skill=>{

      const div = document.createElement('div');

      div.className = 'skill';

      div.innerHTML = `

        <div class="skill-top">

          <h3>${skill.name}</h3>

          <span>${skill.score}%</span>

        </div>

        <div class="bar">
          <div class="fill" style="width:${skill.score}%"></div>
        </div>

      `;

      skillsPreview.appendChild(div);

    });

    updateCircle();

  }

  // RENDER INDUSTRIES

  function renderIndustries(){

    industryPreview.innerHTML = '';

    industries.forEach(item=>{

      const div = document.createElement('div');

      div.className = 'match-item';

      div.innerHTML = `

        <div class="match-top">

          <div class="match-name">
            ${item.name}
          </div>

          <div class="match-score">
            ${item.score}%
          </div>

        </div>

        <div class="match-bar">
          <div class="match-fill" style="width:${item.score}%"></div>
        </div>

      `;

      industryPreview.appendChild(div);

    });

  }

  // RENDER ROLES

  function renderRoles(){

    rolesPreview.innerHTML = '';

    roles.forEach(item=>{

      const div = document.createElement('div');

      div.className = 'match-item';

      div.innerHTML = `

        <div class="match-top">

          <div class="match-name">
            ${item.name}
          </div>

          <div class="match-score">
            ${item.score}%
          </div>

        </div>

        <div class="match-bar">
          <div class="match-fill" style="width:${item.score}%"></div>
        </div>

      `;

      rolesPreview.appendChild(div);

    });

  }

  // UPDATE SKILLS

  function updateSkill(index,value){

    skills[index].name = value;

    renderSkills();

  }

  function updateSkillScore(index,value){

    skills[index].score = Number(value);

    renderSkills();

  }

  // UPDATE INDUSTRIES

  function updateIndustry(index,value){

    industries[index].name = value;

    renderIndustries();

  }

  function updateIndustryScore(index,value){

    industries[index].score = Number(value);

    renderIndustries();

  }

  // UPDATE ROLES

  function updateRole(index,value){

    roles[index].name = value;

    renderRoles();

  }

  function updateRoleScore(index,value){

    roles[index].score = Number(value);

    renderRoles();

  }

  // UPDATE CIRCLE

  function updateCircle(){

    const avg = Math.round(

      skills.reduce((sum,item)=>
        sum + item.score,0
      ) / skills.length

    );

    document.getElementById('overallScore').innerText = avg + '%';

    const circle = document.getElementById('progressCircle');

    const radius = 95;

    const circumference = 2 * Math.PI * radius;

    circle.style.strokeDasharray = circumference;

    circle.style.strokeDashoffset =
      circumference - (avg / 100) * circumference;

  }

  // DOWNLOAD FUNCTION

  async function downloadSection(id, filename){

    const card = document.getElementById(id);

    const canvas = await html2canvas(card,{
      scale:3,
      backgroundColor:null
    });

    const link = document.createElement('a');

    link.download = filename;

    link.href = canvas.toDataURL('image/png');

    link.click();

  }

  // INITIAL RENDER

  renderFields();

  renderSkills();

  renderIndustries();

  renderRoles();

</script>

</body>
</html>
